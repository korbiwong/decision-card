name: quotes
on:
  schedule:
    - cron: "*/5 1-8 * * 1-5"
    - cron: "*/15 13-20 * * 1-5"
  workflow_dispatch:
permissions: { contents: write }
jobs:
  quotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance requests pandas
      - env: { NTFY_TOPIC: "${{ secrets.NTFY_TOPIC }}", MAIL_TO: "${{ secrets.MAIL_TO }}", GMAIL_USER: "${{ secrets.GMAIL_USER }}", GMAIL_APP_PASSWORD: "${{ secrets.GMAIL_APP_PASSWORD }}" }
        run: python quotes.py
      - run: |
          git config user.name quotes; git config user.email quotes@users.noreply.github.com
          git add quotes.json intraday.json state.json; git diff --cached --quiet || (git commit -m "quotes" && git push)
