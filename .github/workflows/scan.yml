name: scan
on:
  schedule:
    - cron: "20 8 * * 1-5"
    - cron: "20 20 * * 1-5"
    - cron: "20 21 * * 1-5"
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: scan-writes, cancel-in-progress: false }
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance requests pandas openpyxl lxml
      - env: { NTFY_TOPIC: "${{ secrets.NTFY_TOPIC }}", MAIL_TO: "${{ secrets.MAIL_TO }}", GMAIL_USER: "${{ secrets.GMAIL_USER }}", GMAIL_APP_PASSWORD: "${{ secrets.GMAIL_APP_PASSWORD }}" }
        run: |
          case "${{ github.event.schedule }}" in
            "20 8 * * 1-5") python scanner.py HK ;;
            "20 20 * * 1-5"|"20 21 * * 1-5") python scanner.py US ;;
            *) python scanner.py HK US ;;
          esac
          python quotes.py
      - if: always()
        run: |
          git config user.name scanner; git config user.email scanner@users.noreply.github.com
          git add signals_*.json quotes.json intraday.json state.json; git diff --cached --quiet || git commit -m "scan $(date +%F)"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep 10; done
