name: quotes-loop
# 平日全日行住（.github/loop.sh）：交易時段每 10 分鐘更新報價，收市後做掃描。
# 每個 run 行到就嚟 6 小時就叫醒下一個自己，所以唔使靠 GitHub cron 準時。
# 下面嘅 cron 只係後備：星期日晚重新開始，或者條鏈斷咗時接返。
# 已經有一個喺度行緊，後嚟嗰個會排隊；週末一開就即刻完。
on:
  schedule:
    - cron: "0 20 * * 0"      # 星期日晚（UTC）開始新一個星期
    - cron: "0 22 * * 0"
    - cron: "0 0 * * 1-5"     # 平日後備
    - cron: "0 12 * * 1-5"
  workflow_dispatch:
permissions: { contents: write, actions: write }
concurrency: { group: quotes-loop, cancel-in-progress: false }
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 359
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance requests pandas openpyxl lxml
      - env:
          NTFY_TOPIC: "${{ secrets.NTFY_TOPIC }}"
          MAIL_TO: "${{ secrets.MAIL_TO }}"
          GMAIL_USER: "${{ secrets.GMAIL_USER }}"
          GMAIL_APP_PASSWORD: "${{ secrets.GMAIL_APP_PASSWORD }}"
          GH_TOKEN: "${{ github.token }}"
        run: |
          git config user.name quotes; git config user.email quotes@users.noreply.github.com
          bash .github/loop.sh
